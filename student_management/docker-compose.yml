version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: student_management_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student_network
    env_file:
      - .env

volumes:
  postgres_data:

networks:
  student_network:
    driver: bridge